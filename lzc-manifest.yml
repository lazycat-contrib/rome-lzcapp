application:
  subdomain: rome
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://rome:8080/
  injects:
    - id: open-save-chooser
      'on': browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
services:
  rome:
    # upstream: yunfanye/rome:1.1.152
    image: docker.1ms.run/yunfanye/rome:1.1.152
    binds:
      - /lzcapp/var/app:/app
      - /lzcapp/var/user-home:/home/user
      - /lzcapp/var/rome-home:/home/rome
      - /lzcapp/var/ssh-host-keys:/etc/ssh/ssh_host_keys
      - /lzcapp/var/tailscale:/var/lib/tailscale
    environment:
      - NODE_ENV=production
      - WEB_HOST=0.0.0.0
      - TS_HOSTNAME=rome
      - ROME_ENABLE_CHROME=1
      - ROME_ENABLE_CDP_AUTOMATION=false
      - ROME_CHROME_CDP_PORT=9222
      - ROME_CHROME_FULLSCREEN=0
      - ROME_CHROME_CLIPBOARD_DEFAULT_SETTING=allow
      - ROME_NOVNC_PORT=6080
      - ROME_DOCKER_APP_CODE_MODE=source
      - ROME_DOCKER_USER_MODE=multi
      - WECHAT_USER_ENABLED=false
      - ROME_HOST_EXECUTION_ENABLED=false
    shm_size: 1gb
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:9368/health").then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
usage: 保留上游 Guardian 会话认证及首次初始化流程。首次启动需复制内置运行时到持久目录，可能较慢。包含浏览器运行环境，依照上游需要 SYS_ADMIN、1GB共享内存和 FUSE 权限；只授予可信用户。禁用宿主执行助手及个人微信集成。不暴露独立 CDP/noVNC 端口。未配置可选的集中式 OTEL 日志收集服务。
