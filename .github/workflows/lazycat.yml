name: Publish LazyCat LPK
'on':
  workflow_dispatch:
    inputs:
      dry-run:
        description: Validate without store publication
        type: boolean
        default: true
        required: true
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: lazycat-publish-rome
  cancel-in-progress: false
jobs:
  lazycat:
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      dry-run: ${{ inputs.dry-run }}
      config: .github/lazycat-action.yml
      image-id: rome
      toolchains: none
      versioned-release-asset: true
    secrets:
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
