version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/rome.lpk
  target_arch: amd64
update:
  strategy: publish
  sync_license: true
  allow_downgrade: false
  version_source:
    type: image
    image: rome
build:
  run_buildscript: false
images:
- id: rome
  target: service
  service: rome
  source: yunfanye/rome
  channel: stable
  sort: semver
  tag_regex: ^v?\d+\.\d+\.\d+$
  delivery:
    mode: mirror
    require_digest_match: true
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Rome
    summary: 自托管个人智能体工作空间
